<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AG Search — Formulary & Patient Contribution</title>
<meta name="description" content="Fast, typo-tolerant formulary lookup. Search any drug, brand or class and see what the patient pays.">
<meta name="theme-color" content="#FBF7F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151113" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AG Search">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="images/icon-maskable.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>
(function(){var t=null;try{t=localStorage.getItem('ag.theme')}catch(e){}if(t!=='light'&&t!=='dark'){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t)})();
</script>
<script src="js/paid.js" defer></script>
<script src="js/app.js" defer></script>
</head>
<body>
<div class="ambient" aria-hidden="true"></div>
<div class="shell">
  <header class="topbar" id="topbar">
    <a class="brand" href="./" id="brand-link" aria-label="AG Search home">
      <img src="images/logo.svg" alt="" width="40" height="40">
      <span class="brand-text"><span class="brand-name">AG Search</span><span class="brand-sub">Formulary · Patient share</span></span>
    </a>
    <nav class="topbar-actions" aria-label="App">
      <button class="icon-btn" id="theme-btn" aria-label="Toggle dark mode" title="Theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="icon-btn" id="about-btn" aria-label="About and tips" title="About">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.2"/></svg>
      </button>
    </nav>
  </header>

  <section class="search-zone" id="search-zone" aria-label="Search">
    <div class="search-inner">
      <div class="search-box" id="search-box">
        <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
        <input id="q" type="search" enterkeyhint="search" inputmode="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" dir="auto" placeholder="Search a drug, brand or class…" aria-label="Search drugs" aria-controls="results">
        <span class="kbd" id="kbd-hint" aria-hidden="true">/</span>
        <button class="clear-btn" id="clear-btn" aria-label="Clear search" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="toolbar" id="toolbar" role="toolbar" aria-label="Filters">
        <div class="segmented" id="price-seg" data-i="0" role="radiogroup" aria-label="Price">
          <span class="seg-thumb" aria-hidden="true"></span>
          <button role="radio" aria-checked="true" class="on" data-v="all">All <span class="seg-count" id="c-all"></span></button>
          <button role="radio" aria-checked="false" data-v="free">Free <span class="seg-count" id="c-free"></span></button>
          <button role="radio" aria-checked="false" data-v="paid">Paid <span class="seg-count" id="c-paid"></span></button>
        </div>
        <button class="chip" id="chip-class" data-sheet="class">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>
          <span class="chip-label">Class</span><span class="chip-x" aria-hidden="true">×</span>
        </button>
        <button class="chip" id="chip-form" data-sheet="form">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8.5" width="18" height="7" rx="3.5" transform="rotate(-35 12 12)"/><path d="m9.5 8.6 5 6.8"/></svg>
          <span class="chip-label">Form</span><span class="chip-x" aria-hidden="true">×</span>
        </button>
        <button class="chip" id="chip-sort" data-sheet="sort">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M3.5 16.5 7 20l3.5-3.5M17 20V4M13.5 7.5 17 4l3.5 3.5"/></svg>
          <span class="chip-label">Best match</span>
        </button>
        <button class="chip" id="chip-pins" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.4-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.8-7.5 10.2-7.5 10.2z"/></svg>
          <span class="chip-label">Saved</span>
        </button>
      </div>
    </div>
  </section>

  <main class="layout" id="main">
    <section id="results-col" aria-live="polite">
      <div class="results-meta" id="results-meta"></div>
      <div class="results" id="results"><div class="skeleton" aria-hidden="true"><div></div><div></div><div></div><div></div></div></div>
      <div class="more-loader" id="more-loader"></div>
    </section>
    <aside class="detail-pane" id="detail-pane" aria-label="Details"></aside>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details" tabindex="-1">
  <div class="sheet-grip" id="sheet-grip"><span></span></div>
  <button class="sheet-close" id="sheet-close" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <div class="sheet-body" id="sheet-body"></div>
</div>
<div class="toast" id="toast" role="status"></div>
</body>
</html>
