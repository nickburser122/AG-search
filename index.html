<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>AG Search</title>
<meta name="description" content="Fast offline formulary lookup — search a drug, brand, or class in one tap.">
<meta name="theme-color" content="#D97757" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191817" media="(prefers-color-scheme: dark)">
<link rel="manifest" id="agManifest">
<link rel="icon" id="agFavicon" type="image/svg+xml" sizes="any">
<link rel="icon" type="image/svg+xml" sizes="16x16" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20192%20192'%3E%3Crect%20width='192'%20height='192'%20rx='42'%20fill='%23D97757'/%3E%3Cg%20transform='rotate(-45%2096%2096)'%3E%3Crect%20x='35'%20y='73'%20width='122'%20height='46'%20rx='23'%20fill='%23FAF9F5'/%3E%3Cpath%20d='M96%2073V119'%20fill='none'%20stroke='%23D97757'%20stroke-width='10'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" id="agAppleIcon">
<script>
(function(){
  var enc = function(s){ return 'data:image/svg+xml,' + encodeURIComponent(s); };
  var GLYPH =
    "<path d='M110 108 140 138' fill='none' stroke='#FAF9F5' stroke-width='20' stroke-linecap='round'/>" +
    "<circle cx='82' cy='80' r='40' fill='none' stroke='#FAF9F5' stroke-width='15'/>" +
    "<g transform='rotate(-45 82 80)'>" +
      "<rect x='61' y='70.5' width='42' height='19' rx='9.5' fill='#FAF9F5'/>" +
      "<path d='M82 70.5V89.5' fill='none' stroke='#D97757' stroke-width='5'/>" +
    "</g>";
  var wrap = function(inner){
    return "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192' width='192' height='192'>" + inner + "</svg>";
  };
  var ICON = wrap("<rect width='192' height='192' rx='42' fill='#D97757'/><g transform='translate(5 5)'>" + GLYPH + "</g>");
  var MASK = wrap("<rect width='192' height='192' fill='#D97757'/><g transform='translate(96 96) scale(.7) translate(-92 -90)'>" + GLYPH + "</g>");

  document.getElementById('agFavicon').href = enc(ICON);
  document.getElementById('agManifest').href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify({
    name: 'AG Search', short_name: 'AG Search',
    description: 'Fast offline formulary lookup',
    start_url: './', display: 'standalone',
    background_color: '#FAF9F5', theme_color: '#D97757',
    icons: [
      { src: enc(ICON), sizes: 'any', type: 'image/svg+xml', purpose: 'any' },
      { src: enc(MASK), sizes: 'any', type: 'image/svg+xml', purpose: 'maskable' }
    ]
  }));

  var img = new Image();
  img.onload = function(){
    try {
      var c = document.createElement('canvas'); c.width = c.height = 180;
      c.getContext('2d').drawImage(img, 0, 0, 180, 180);
      document.getElementById('agAppleIcon').href = c.toDataURL('image/png');
    } catch(e){}
  };
  img.src = enc(ICON);
})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AG Search">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<style>
:root{
  --milk: #FAF9F5;
  --pampas: #F4F3EE;
  --card: #FFFDFA;
  --ink: #1F1E1D;
  --ink-2: #4A4741;
  --ink-3: #8C877D;
  --cloudy: #B1ADA1;
  --clay: #D97757;
  --crail: #C15F3C;
  --cloth: #D4A27F;
  --clay-wash: rgba(217,119,87,.10);
  --clay-ring: rgba(217,119,87,.30);
  --gp: #6E8B74;
  --sp: #B0763F;
  --cons: #7A6A9B;
  --cmte: #5E7CA8;
  --nu-lo: rgba(120,98,80,.10);
  --nu-lo2: rgba(120,98,80,.06);
  --nu-hi: rgba(255,255,255,.90);
  --sh-card: 0 1px 2px var(--nu-lo2), 0 6px 16px -6px var(--nu-lo);
  --sh-raise: 0 2px 4px var(--nu-lo2), 0 14px 32px -10px var(--nu-lo);
  --sh-well: inset 0 2px 4px var(--nu-lo), inset 0 -1px 0 var(--nu-hi);
  --r-xs: 8px; --r-sm: 12px; --r-md: 16px; --r-lg: 22px; --r-xl: 28px; --r-pill: 999px;
  --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
  --ar: "SF Arabic","Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;
  --ease: cubic-bezier(.22,.61,.36,1);
  --header-h: 56px;
  --bottom-h: 58px;
}
@media (prefers-color-scheme: dark){
  :root{
    --milk:#191817; --pampas:#211F1D; --card:#262422;
    --ink:#F2EFE9; --ink-2:#C9C3B8; --ink-3:#918B80; --cloudy:#4A4640;
    --clay:#E08A6B; --crail:#D97757; --cloth:#C99A78;
    --nu-lo:rgba(0,0,0,.44); --nu-lo2:rgba(0,0,0,.28); --nu-hi:rgba(255,255,255,.05);
  }
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{
  margin:0; background:var(--milk); color:var(--ink); font-family:var(--sans);
  font-variant-numeric:tabular-nums; overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
button{ font-family:inherit; }
#app{ max-width:720px; margin:0 auto; min-height:100%; position:relative; padding-bottom:calc(var(--bottom-h) + env(safe-area-inset-bottom)); }

.header{
  position:sticky; top:0; z-index:30; height:var(--header-h);
  display:flex; align-items:center; gap:10px; padding:0 14px;
  padding-top:env(safe-area-inset-top);
  background:color-mix(in srgb, var(--milk) 68%, transparent);
  -webkit-backdrop-filter:blur(20px) saturate(1.35); backdrop-filter:blur(20px) saturate(1.35);
  border-bottom:1px solid color-mix(in srgb, var(--cloudy) 30%, transparent);
}
.header .brandmark{
  flex:0 0 auto; display:block; border-radius:8px; box-shadow:var(--sh-card);
}
.header h1{
  font-family:var(--serif); font-size:17px; font-weight:600; letter-spacing:-.01em; margin:0;
  flex:0 0 auto;
}
.header .settings-btn{
  margin-inline-start:auto; width:34px; height:34px; border-radius:var(--r-pill); border:none;
  background:transparent; color:var(--ink-2); display:flex; align-items:center; justify-content:center;
  cursor:pointer;
}
.header .settings-btn:active{ background:var(--clay-wash); }

.searchwrap{ padding:10px 14px 4px; position:relative; }
.searchbar{
  position:relative; height:54px; border-radius:var(--r-pill); background:var(--pampas);
  box-shadow:var(--sh-well); display:flex; align-items:center; padding:0 8px 0 48px;
}
.searchbar::before{
  content:''; position:absolute; inset:-8px; border-radius:calc(var(--r-pill) + 8px);
  background:radial-gradient(120px 60px at 50% 50%, var(--cloth), transparent 70%);
  opacity:0; transition:opacity .18s var(--ease); pointer-events:none; z-index:-1;
}
.searchbar.focused::before{ opacity:.20; }
.searchbar.focused{ box-shadow:var(--sh-well), 0 0 0 2px var(--clay-ring); }
.searchbar svg.icon-search{ position:absolute; left:16px; width:19px; height:19px; color:var(--ink-3); }
#q{
  border:none; background:transparent; outline:none; width:100%; height:100%;
  font-size:16px; color:var(--ink); font-family:var(--sans);
}
#q::placeholder{ color:var(--ink-3); }
.clearbtn{
  width:30px; height:30px; border-radius:var(--r-pill); border:none; background:var(--card);
  color:var(--ink-3); display:flex; align-items:center; justify-content:center; cursor:pointer;
  opacity:0; transform:scale(.8); transition:opacity .12s var(--ease), transform .12s var(--ease);
  flex:0 0 auto;
}
.clearbtn.show{ opacity:1; transform:scale(1); }

.chiprow{
  display:flex; gap:8px; overflow-x:auto; padding:10px 14px; scroll-snap-type:x proximity;
  -ms-overflow-style:none; scrollbar-width:none;
}
.chiprow::-webkit-scrollbar{ display:none; }
.chip{
  flex:0 0 auto; scroll-snap-align:start; height:34px; padding:0 14px; border-radius:var(--r-pill);
  background:var(--pampas); border:1px solid color-mix(in srgb, var(--cloudy) 40%, transparent);
  color:var(--ink-2); font-size:13.5px; display:flex; align-items:center; gap:6px; cursor:pointer;
  transition:transform .1s var(--ease), background .15s var(--ease), color .15s var(--ease);
}
.chip:active{ transform:scale(.96); }
.chip.active{ background:var(--clay); color:#fff; border-color:transparent; box-shadow:var(--sh-card); }
.chip .count{
  background:rgba(255,255,255,.35); border-radius:var(--r-pill); font-size:11px; padding:1px 6px;
}
.chip.active .count{ background:rgba(255,255,255,.28); }

#results{ padding:4px 14px 8px; display:flex; flex-direction:column; gap:8px; }
.card{
  background:var(--card); border-radius:var(--r-lg); box-shadow:var(--sh-card); padding:14px;
  display:grid; grid-template-columns:1fr auto; column-gap:10px; cursor:pointer;
  transition:transform .12s var(--ease), box-shadow .12s var(--ease);
  content-visibility:auto; contain-intrinsic-size:auto 88px; contain:content;
}
.card:active{ transform:scale(.985); box-shadow:var(--sh-raise); }
.card-main{ min-width:0; }
.card-name{
  font-size:16px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap;
}
.card-name b{
  color:var(--crail); background:var(--clay-wash); border-radius:4px; padding:0 2px; font-weight:700;
  font-style:normal;
}
.pillrow{ display:flex; align-items:center; gap:6px; margin-top:6px; flex-wrap:wrap; }
.pill{
  font-size:11.5px; padding:2px 8px; border-radius:var(--r-pill); background:var(--pampas);
  color:var(--ink-2); white-space:nowrap;
}
.pill-conc{ background:color-mix(in srgb, var(--cloth) 35%, var(--pampas)); color:var(--ink); font-variant-numeric:tabular-nums; }
.pill-auth-gp{ background:color-mix(in srgb, var(--gp) 22%, var(--pampas)); color:color-mix(in srgb, var(--gp) 75%, black); }
.pill-auth-sp{ background:color-mix(in srgb, var(--sp) 22%, var(--pampas)); color:color-mix(in srgb, var(--sp) 75%, black); }
.pill-auth-cons{ background:color-mix(in srgb, var(--cons) 22%, var(--pampas)); color:color-mix(in srgb, var(--cons) 75%, black); }
.pill-auth-committee{ background:color-mix(in srgb, var(--cmte) 22%, var(--pampas)); color:color-mix(in srgb, var(--cmte) 75%, black); }
.pill-duration{ font-family:var(--ar); }
.pill.inherited{ opacity:.7; }
.card-class{
  margin-top:6px; font-size:12px; color:var(--ink-3); overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap;
}
.card-rail{ display:flex; flex-direction:column; align-items:center; justify-content:space-between; gap:8px; }
.scorering{ width:28px; height:28px; }
.copybtn{
  width:30px; height:30px; border-radius:var(--r-pill); border:none; background:var(--pampas);
  color:var(--ink-3); display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.copybtn:active{ background:var(--clay-wash); color:var(--crail); }
.matchbadge{ font-size:9.5px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.04em; }

#sentinel{ height:1px; }

.emptystate{
  padding:14vh 24px 24px; text-align:center;
}
.emptystate .greet{
  font-family:var(--serif); font-size:22px; color:var(--ink); margin-bottom:18px;
}
.emptystate .bloom{
  width:120px; height:60px; margin:0 auto 14px; border-radius:50%;
  background:radial-gradient(closest-side, var(--clay-wash), transparent 75%);
}
.recentchips{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:10px; }

.bottombar{
  position:fixed; left:0; right:0; bottom:0; z-index:30; max-width:720px; margin:0 auto;
  height:var(--bottom-h); padding:0 14px calc(env(safe-area-inset-bottom)) 14px;
  display:flex; align-items:center; justify-content:space-between;
  background:color-mix(in srgb, var(--milk) 68%, transparent);
  -webkit-backdrop-filter:blur(20px) saturate(1.35); backdrop-filter:blur(20px) saturate(1.35);
  border-top:1px solid color-mix(in srgb, var(--cloudy) 30%, transparent);
  transition:transform .2s var(--ease);
}
.bottombar.hide{ transform:translateY(100%); }
.resultcount{ font-size:13px; color:var(--ink-3); }
.bottomicons{ display:flex; gap:6px; }
.iconbtn{
  width:36px; height:36px; border-radius:var(--r-pill); border:none; background:transparent;
  color:var(--ink-2); display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.iconbtn:active{ background:var(--clay-wash); }

.sheetbackdrop{
  position:fixed; inset:0; background:rgba(31,30,29,.32); z-index:40; opacity:0;
  transition:opacity .2s var(--ease); pointer-events:none;
}
.sheetbackdrop.show{ opacity:1; pointer-events:auto; }
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:41; max-width:720px; margin:0 auto;
  background:var(--card); border-radius:var(--r-xl) var(--r-xl) 0 0;
  box-shadow:0 -8px 40px rgba(0,0,0,.18); max-height:82vh; display:flex; flex-direction:column;
  transform:translateY(100%); transition:transform .22s var(--ease);
  padding-bottom:env(safe-area-inset-bottom);
}
.sheet.show{ transform:translateY(0); }
.sheet-handle{ width:36px; height:4px; border-radius:2px; background:var(--cloudy); margin:10px auto 4px; flex:0 0 auto; }
.sheet-head{ display:flex; align-items:center; justify-content:space-between; padding:6px 18px 10px; flex:0 0 auto; }
.sheet-head h2{ font-family:var(--serif); font-size:18px; margin:0; }
.sheet-body{ overflow-y:auto; padding:0 18px 18px; }
.sheet-close{ border:none; background:var(--pampas); width:30px; height:30px; border-radius:var(--r-pill); color:var(--ink-2); cursor:pointer; }

.facet-group{ margin-bottom:18px; }
.facet-title{ font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); margin-bottom:8px; }
.facet-chips{ display:flex; flex-wrap:wrap; gap:8px; }

.rowline{
  display:flex; align-items:center; justify-content:space-between; padding:13px 2px;
  border-bottom:1px solid color-mix(in srgb, var(--cloudy) 25%, transparent); cursor:pointer;
}
.rowline:last-child{ border-bottom:none; }
.rowline .rl-label{ font-size:15px; color:var(--ink); }
.rowline .rl-check{ color:var(--clay); opacity:0; }
.rowline.selected .rl-check{ opacity:1; }

.slider-row{ padding:10px 2px 18px; }
input[type=range]{ width:100%; accent-color:var(--clay); }
.slider-labels{ display:flex; justify-content:space-between; font-size:11px; color:var(--ink-3); margin-top:2px; }

.togglerow{ display:flex; align-items:center; justify-content:space-between; padding:12px 2px; }
.switch{ width:44px; height:26px; border-radius:var(--r-pill); background:var(--pampas); position:relative; cursor:pointer; box-shadow:var(--sh-well); flex:0 0 auto; }
.switch::after{ content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:var(--sh-card); transition:transform .16s var(--ease); }
.switch.on{ background:var(--clay); }
.switch.on::after{ transform:translateX(18px); }

.detail-title{ font-family:var(--serif); font-size:20px; margin:0 0 4px; }
.detail-sub{ color:var(--ink-3); font-size:13px; margin-bottom:14px; }
.detail-grid{ display:flex; flex-direction:column; gap:2px; }
.detail-row{ display:flex; justify-content:space-between; gap:14px; padding:10px 0; border-bottom:1px solid color-mix(in srgb, var(--cloudy) 20%, transparent); }
.detail-row:last-child{ border-bottom:none; }
.detail-k{ font-size:13px; color:var(--ink-3); flex:0 0 110px; }
.detail-v{ font-size:14.5px; color:var(--ink); text-align:end; }
.detail-v[dir=auto]{ font-family:var(--ar); }
.detail-actions{ display:flex; gap:10px; margin-top:18px; }
.btn{
  flex:1; height:46px; border-radius:var(--r-md); border:none; background:var(--pampas);
  color:var(--ink); font-size:14.5px; font-weight:600; display:flex; align-items:center;
  justify-content:center; gap:8px; cursor:pointer;
}
.btn.primary{ background:var(--clay); color:#fff; }
.btn:active{ transform:scale(.98); }
.inh-note{ font-size:11px; color:var(--ink-3); margin-top:2px; }

.about-dedication{ font-family:var(--serif); font-style:italic; font-size:12.5px; color:var(--ink-3); text-align:center; margin-top:22px; }
.about-line{ font-size:13.5px; color:var(--ink-2); line-height:1.6; margin-bottom:10px; }
.datav{ font-size:11.5px; color:var(--ink-3); text-align:center; margin-top:14px; }

.toast{
  position:fixed; left:50%; bottom:calc(var(--bottom-h) + 14px + env(safe-area-inset-bottom));
  transform:translate(-50%, 8px); background:var(--ink); color:var(--milk); font-size:13.5px;
  padding:9px 16px; border-radius:var(--r-pill); z-index:50; opacity:0; pointer-events:none;
  transition:opacity .18s var(--ease), transform .18s var(--ease); box-shadow:var(--sh-raise);
}
.toast.show{ opacity:1; transform:translate(-50%, 0); }

.ios-hint{
  position:fixed; left:14px; right:14px; bottom:calc(var(--bottom-h) + 10px + env(safe-area-inset-bottom));
  background:var(--card); border-radius:var(--r-md); box-shadow:var(--sh-raise); padding:12px 14px;
  font-size:13px; color:var(--ink-2); z-index:35; display:flex; align-items:center; gap:10px;
  max-width:720px; margin:0 auto;
}
.ios-hint button{ margin-inline-start:auto; border:none; background:transparent; color:var(--ink-3); font-size:18px; cursor:pointer; }

@media (prefers-reduced-motion: reduce){
  *{ transition-duration:1ms !important; animation-duration:1ms !important; }
  .searchbar.focused::before{ display:none; }
}
::selection{ background:var(--clay-wash); color:var(--crail); }

</style>
</head>
<body>
  <div id="app">
    <header class="header">
      <svg class="brandmark" viewBox="0 0 192 192" width="30" height="30" aria-hidden="true">
        <rect width="192" height="192" rx="42" fill="#D97757"/>
        <g transform="translate(5 5)">
          <path d="M110 108 140 138" fill="none" stroke="#FAF9F5" stroke-width="20" stroke-linecap="round"/>
          <circle cx="82" cy="80" r="40" fill="none" stroke="#FAF9F5" stroke-width="15"/>
          <g transform="rotate(-45 82 80)">
            <rect x="61" y="70.5" width="42" height="19" rx="9.5" fill="#FAF9F5"/>
            <path d="M82 70.5V89.5" fill="none" stroke="#D97757" stroke-width="5"/>
          </g>
        </g>
      </svg>
      <h1>AG&nbsp;Search</h1>
      <button class="settings-btn" id="settingsBtn" aria-label="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"></path></svg>
      </button>
    </header>

    <div class="searchwrap">
      <div class="searchbar" id="searchbar">
        <svg class="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path></svg>
        <input id="q" type="text" inputmode="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Search a drug, brand, or class…" aria-label="Search formulary">
        <button class="clearbtn" id="clearbtn" aria-label="Clear search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"></path></svg>
        </button>
      </div>
    </div>

    <div class="chiprow" id="chiprow"></div>

    <div id="results" aria-live="polite"></div>
    <div id="sentinel"></div>
  </div>

  <div class="bottombar" id="bottombar">
    <span class="resultcount" id="resultcount"></span>

  <script type="text/plain" id="sw-source">
const CACHE = 'rx-v4';
self.addEventListener('install', e => {
  self.skipWaiting();
  e.waitUntil(caches.open(CACHE).then(c => c.add('./')));
});
self.addEventListener('activate', e => {
  e.waitUntil(
    caches.keys().then(keys => Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k))))
  );
  self.clients.claim();
});
self.addEventListener('fetch', e => {
  const url = new URL(e.request.url);
  if (url.origin !== location.origin){ return; }
  e.respondWith(
    caches.match(e.request).then(cached => {
      if (cached) return cached;
      return fetch(e.request).then(res => {
        const copy = res.clone();
        caches.open(CACHE).then(c => c.put(e.request, copy));
        return res;
      }).catch(() => cached);
    })
  );
});

const DEDICATION = "For every pharmacist who ever squinted at a handwritten script at 2am.";

const CONFIG = { defaultLimit: 30, defaultEnough: 25 };

const F = Object.fromEntries(SCHEMA.fields.map((f,i)=>[f.key,i]));
const ROW = (i,k) => DATA[i][F[k]];
const N = DATA.length;
const ALL_INDICES = Array.from({length:N}, (_,i)=>i);

const AR_DIACRITICS = /[\u0610-\u061A\u064B-\u0652\u0670\u06D6-\u06ED\u0640]/g;
const AR_DIGIT = /[\u0660-\u0669\u06F0-\u06F9]/g;
const BIDI_JUNK = /[\u200B-\u200F\u202A-\u202E]/g;

function norm(s){
  if (s == null) return '';
  return String(s)
    .toLowerCase()
    .normalize('NFKD').replace(/[\u0300-\u036f]/g,'')
    .replace(AR_DIACRITICS,'')
    .replace(/[أإآٱ]/g,'ا').replace(/[ىي]/g,'ي')
    .replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ة/g,'ه')
    .replace(AR_DIGIT, d => String(d.charCodeAt(0) & 0xF))
    .replace(BIDI_JUNK,'')
    .replace(/(\d)\s*(mg|mcg|µg|ug|g|ml|iu|%)/g,'$1$2')
    .replace(/[^\p{L}\p{N}%+.'-]+/gu,' ')
    .replace(/\s+/g,' ').trim();
}

const UNIT_ALIAS = { 'ug':'mcg', 'µg':'mcg', 'iu':'iu', 'i.u':'iu' };
function canonUnit(u){
  if (!u) return null;
  u = u.toLowerCase().replace(/\./g,'');
  return UNIT_ALIAS[u] || u;
}
function parseDoseTokens(str){
  if (!str) return [];
  const out = [];
  const re = /(\d+(?:\.\d+)?)\s*(mg|mcg|µg|ug|g|ml|iu|i\.u|%)?/gi;
  let m;
  while ((m = re.exec(str))) out.push({ num: parseFloat(m[1]), unit: canonUnit(m[2]) });
  return out;
}
function doseMatches(constraint, tokens){
  if (!tokens || !tokens.length) return false;
  for (const t of tokens){
    if (Math.abs(t.num - constraint.num) < 1e-9){
      if (!constraint.unit || !t.unit || constraint.unit === t.unit) return true;
    }
  }
  if (tokens.length >= 2){
    const nums = tokens.map(t=>t.num).sort((a,b)=>a-b);
    if (constraint.num >= nums[0] && constraint.num <= nums[nums.length-1]) return true;
  }
  return false;
}

const DOSE_TOKEN_RE = /^(\d+(?:\.\d+)?)(mg|mcg|µg|ug|g|ml|iu|%)?$/i;

function parseQuery(raw){
  const out = {
    freeTerms: [], phrases: [], excludes: [],
    doseConstraints: [], formFacet: [], fieldFilters: { form:[], auth:[], group:[] },
  };
  if (!raw) return out;
  const re = /"([^"]+)"|(\S+)/g;
  let m;
  while ((m = re.exec(raw))){
    if (m[1] != null){ const p = norm(m[1]); if (p) out.phrases.push(p); continue; }
    let tok = m[2];
    if (tok.startsWith('-') && tok.length > 1){ const ex = norm(tok.slice(1)); if (ex) out.excludes.push(ex); continue; }
    const fieldMatch = /^(max|day|form|auth|group):(.+)$/i.exec(tok);
    if (fieldMatch){
      const field = fieldMatch[1].toLowerCase();
      const val = fieldMatch[2];
      if (field === 'max' || field === 'day'){
        const dm = DOSE_TOKEN_RE.exec(val);
        if (dm){ out.doseConstraints.push({ field, num: parseFloat(dm[1]), unit: canonUnit(dm[2]) }); continue; }
      } else { out.fieldFilters[field].push(norm(val)); continue; }
    }
    const dm2 = DOSE_TOKEN_RE.exec(tok);
    if (dm2){ out.doseConstraints.push({ field:'conc', num: parseFloat(dm2[1]), unit: canonUnit(dm2[2]) }); continue; }
    const nt = norm(tok);
    if (!nt) continue;
    let matchedForm = null;
    for (const k in SCHEMA.enums.form){
      const e = SCHEMA.enums.form[k];
      if (k === nt || norm(e.s) === nt || norm(e.l) === nt){ matchedForm = k; break; }
    }
    if (matchedForm){ out.formFacet.push(matchedForm); continue; }
    out.freeTerms.push(nt);
  }
  return out;
}

let META, HAY_A, HAY_B, TOKENS, PRE, FACET;
function addFacet(map, key, i){ let s = map.get(key); if (!s){ s = []; map.set(key, s); } s.push(i); }

function build(){
  META = new Array(N);
  HAY_A = new Array(N);
  HAY_B = new Array(N);
  TOKENS = new Array(N);
  PRE = new Map();
  FACET = { form: new Map(), auth: new Map(), group: new Map() };
  for (let i=0;i<N;i++){
    const name = ROW(i,'name'), conc = ROW(i,'conc'), formKey = ROW(i,'form'), authKey = ROW(i,'auth'),
          duration = ROW(i,'duration'), maxDose = ROW(i,'maxDose'), dayDose = ROW(i,'dayDose'),
          group = ROW(i,'group'), syn = ROW(i,'syn') || [];
    const formLbl = formKey ? SCHEMA.enums.form[formKey] : null;
    const authLbl = authKey ? SCHEMA.enums.auth[authKey] : null;
    const nName = norm([name, syn.join(' '), conc||'', formLbl ? (formLbl.l+' '+formLbl.s) : ''].join(' '));
    const nAll = norm([nName, authLbl ? (authLbl.l+' '+authLbl.s) : '', duration||'', group||'', maxDose||'', dayDose||''].join(' '));
    HAY_A[i] = nName; HAY_B[i] = nAll;
    const toks = nName.split(' ').filter(Boolean);
    TOKENS[i] = toks;
    for (const t of toks){ if (t.length >= 3) addFacet(PRE, t.slice(0,3), i); }
    META[i] = { concTokens: parseDoseTokens(conc), maxTokens: parseDoseTokens(maxDose), dayTokens: parseDoseTokens(dayDose) };
    if (formKey) addFacet(FACET.form, formKey, i);
    if (authKey) addFacet(FACET.auth, authKey, i);
    if (group) addFacet(FACET.group, group, i);
  }
}
build();

const UNI = {
  unicode: true,
  interSplit: "[^\\p{L}\\d']+",
  intraSplit: "\\p{Ll}\\p{Lu}",
  intraBound: "\\p{L}\\d|\\d\\p{L}|\\p{Ll}\\p{Lu}",
  intraChars: "[\\p{L}\\d']",
  intraContr: "'\\p{L}{1,2}\\b",
};
const TOLERANCE = {
  strict:    { opts:Object.assign({},UNI,{intraMode:0,intraIns:0,interLft:2,interRgt:1,outOfOrder:0}), rescue:null },
  balanced:  { opts:Object.assign({},UNI,{intraMode:0,intraIns:1,interLft:1,interRgt:0,outOfOrder:1}), rescue:0.65 },
  forgiving: { opts:Object.assign({},UNI,{intraMode:1,intraIns:1,intraSub:1,intraTrn:1,intraDel:1,interLft:0,interRgt:0,outOfOrder:1}), rescue:0.55 },
  wild:      { opts:Object.assign({},UNI,{intraMode:1,intraIns:1,intraSub:1,intraTrn:1,intraDel:1,intraChars:"[\\p{L}\\d' ]",interLft:0,interRgt:0,outOfOrder:1,interIns:1e9}), rescue:0.45 },
};

const ufCache = new Map();
function getUF(opts){
  const key = JSON.stringify(opts);
  let u = ufCache.get(key);
  if (!u){ u = new uFuzzy(opts); ufCache.set(key, u); }
  return u;
}

function scoreOf(inf, k, fieldWeight, pass, needleLen, rank){
  let s = 100 * fieldWeight;
  s += pass===0?120:pass===1?60:pass===2?35:pass===3?15:5;
  const chars = (inf.chars && inf.chars[k]) || 0;
  const terms = (inf.terms && inf.terms[k]) || 0;
  const intraIns = (inf.intraIns && inf.intraIns[k]) || 0;
  const interIns = (inf.interIns && inf.interIns[k]) || 0;
  const lft = ((inf.interLft2 && inf.interLft2[k]) || 0) + ((inf.interLft1 && inf.interLft1[k]) || 0);
  const rgt = ((inf.interRgt2 && inf.interRgt2[k]) || 0) + ((inf.interRgt1 && inf.interRgt1[k]) || 0);
  s += 26 * Math.min(1, chars / Math.max(1, needleLen));
  s += 18 * terms;
  s += lft > 0 ? 22 : 0;
  s += rgt > 0 ? 10 : 0;
  s -= 9 * intraIns;
  s -= 3 * interIns;
  s -= (rank || 0) * 0.08;
  return s;
}

function runUFuzzyPass(opts, haystackFull, universe, needle){
  const out = [];
  if (!needle) return out;
  const uf = getUF(opts);
  const sub = universe.map(i => haystackFull[i]);
  const idxs = uf.filter(sub, needle);
  if (!idxs || !idxs.length) return out;
  const info = uf.info(idxs, sub, needle);
  if (!info.idx.length) return out;
  const order = uf.sort(info, sub, needle);
  for (let rank=0;rank<order.length;rank++){ const oi = order[rank]; out.push({ rowIdx: universe[info.idx[oi]], info, k: oi, rank }); }
  return out;
}

function prefixPass(freeTerms, universeSet){
  if (!freeTerms.length) return null;
  const candidateSets = [];
  for (const term of freeTerms){
    if (term.length < 2) return null;
    const bucket = PRE.get(term.slice(0,3)) || [];
    const verified = new Set();
    for (const i of bucket){
      if (universeSet && !universeSet.has(i)) continue;
      const toks = TOKENS[i];
      for (let ti=0; ti<toks.length; ti++){ if (toks[ti].startsWith(term)){ verified.add(i); break; } }
    }
    candidateSets.push(verified);
  }
  candidateSets.sort((a,b)=>a.size-b.size);
  let result = candidateSets[0];
  for (let ci=1; ci<candidateSets.length; ci++){
    const next = new Set();
    for (const v of result) if (candidateSets[ci].has(v)) next.add(v);
    result = next;
  }
  return result;
}

function diceCoeff(a,b){
  if (a.length < 2 || b.length < 2) return a===b?1:0;
  const bigrams = s => { const m = new Map(); for (let i=0;i<s.length-1;i++){ const g=s.substr(i,2); m.set(g,(m.get(g)||0)+1); } return m; };
  const ma = bigrams(a), mb = bigrams(b);
  let inter = 0;
  for (const [g,c] of ma) if (mb.has(g)) inter += Math.min(c, mb.get(g));
  const total = (a.length-1)+(b.length-1);
  return total <= 0 ? 0 : (2*inter)/total;
}
function damerauLevNorm(a,b){
  const CAP = 24;
  if (a.length > CAP) a = a.slice(0,CAP);
  if (b.length > CAP) b = b.slice(0,CAP);
  const m = a.length, n = b.length;
  if (m===0 || n===0) return m===n?1:0;
  const d = Array.from({length:m+1}, ()=> new Array(n+1).fill(0));
  for (let i=0;i<=m;i++) d[i][0]=i;
  for (let j=0;j<=n;j++) d[0][j]=j;
  for (let i=1;i<=m;i++){
    for (let j=1;j<=n;j++){
      const cost = a[i-1]===b[j-1]?0:1;
      d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+cost);
      if (i>1 && j>1 && a[i-1]===b[j-2] && a[i-2]===b[j-1]) d[i][j] = Math.min(d[i][j], d[i-2][j-2]+cost);
    }
  }
  return 1 - d[m][n] / Math.max(m,n);
}
function rescuePass(term, universe, threshold){
  const out = [];
  for (const i of universe){
    let best = 0;
    for (const tok of TOKENS[i]){ const sc = Math.max(diceCoeff(term,tok), damerauLevNorm(term,tok)); if (sc > best) best = sc; }
    if (best >= threshold) out.push({ rowIdx:i, rescueScore:best });
  }
  return out;
}

function executeSearch(freeTerms, phrases, excludes, universe0, tolerance, enough){
  const tol = TOLERANCE[tolerance] || TOLERANCE.balanced;
  const merged = new Map();
  const put = (rowIdx, score, pass) => { const cur = merged.get(rowIdx); if (!cur || score > cur.score) merged.set(rowIdx, {score, pass}); };
  let universe = universe0;
  if (phrases.length) universe = universe.filter(i => phrases.every(p => HAY_B[i].includes(p)));
  const finish = () => {
    if (excludes.length){ for (const [i] of merged) if (excludes.some(ex => HAY_B[i].includes(ex))) merged.delete(i); }
    return merged;
  };
  if (!freeTerms.length){ for (const i of universe) put(i, 0, 9); return finish(); }
  const needle = freeTerms.join(' ');
  const needleLen = needle.length;
  const universeSet = new Set(universe);

  const pre = prefixPass(freeTerms, universeSet);
  if (pre && pre.size) for (const i of pre) put(i, 1000 - HAY_A[i].length*0.01, 0);

  if (merged.size < enough){
    const passA = runUFuzzyPass(tol.opts, HAY_A, universe, needle);
    for (const r of passA) put(r.rowIdx, scoreOf(r.info, r.k, 1.0, 1, needleLen, r.rank), 1);
  }
  if (merged.size < enough && tolerance !== 'strict'){
    const typoOpts = Object.assign({}, tol.opts, { intraMode:1, intraIns:1, intraSub:1, intraTrn:1, intraDel:1 });
    const passT = runUFuzzyPass(typoOpts, HAY_A, universe, needle);
    for (const r of passT) put(r.rowIdx, scoreOf(r.info, r.k, 1.0, 2, needleLen, r.rank), 2);
  }
  if (merged.size < enough){
    const passB = runUFuzzyPass(tol.opts, HAY_B, universe, needle);
    for (const r of passB) put(r.rowIdx, scoreOf(r.info, r.k, 0.5, 3, needleLen, r.rank), 3);
  }
  if (merged.size < 5 && freeTerms.length === 1 && freeTerms[0].length >= 4 && tol.rescue){
    const resc = rescuePass(freeTerms[0], universe, tol.rescue);
    for (const r of resc) put(r.rowIdx, r.rescueScore*90, 4);
  }
  return finish();
}

const SETTINGS_KEY = 'rx.settings.v3';
const defaultSettings = {
  tolerance: 'balanced', limit: CONFIG.defaultLimit, enough: CONFIG.defaultEnough,
  showScores: false, showProvenance: false, searchArabic: true,
  fieldToggles: { A: true, B: true }, theme: 'auto',
};
function loadSettings(){
  try{ const raw = localStorage.getItem(SETTINGS_KEY); if (raw) return Object.assign({}, defaultSettings, JSON.parse(raw)); }
  catch(e){}
  return Object.assign({}, defaultSettings);
}
function saveSettings(){ try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(state.settings)); }catch(e){} }

function loadJSON(key, fallback){ try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }catch(e){ return fallback; } }
function saveJSON(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

const state = {
  settings: loadSettings(),
  activeFacets: { form: new Set(), auth: new Set(), group: new Set() },
  sort: 'relevance',
  view: 'card',
  recents: loadJSON('rx.recents.v1', []),
  pins: new Set(loadJSON('rx.pins.v1', [])),
  lastQuery: { freeKey: '', structKey: '', resultIdxs: null },
  currentIdxs: [],
  currentPasses: new Map(),
  currentFreeText: '',
  renderCount: 0,
};

function structKey(pq){
  return JSON.stringify({
    f: [...state.activeFacets.form].sort(), a: [...state.activeFacets.auth].sort(), g: [...state.activeFacets.group].sort(),
    ff: pq.fieldFilters, fa: pq.formFacet, dc: pq.doseConstraints, ph: pq.phrases, ex: pq.excludes,
  });
}

function computeUniverse(pq){
  const sets = [];
  for (const type of ['form','auth','group']){
    if (state.activeFacets[type].size){
      const acc = new Set();
      for (const val of state.activeFacets[type]) for (const i of (FACET[type].get(val)||[])) acc.add(i);
      sets.push(acc);
    }
  }
  const formVals = [...pq.fieldFilters.form, ...pq.formFacet];
  if (formVals.length){
    const acc = new Set();
    for (const val of formVals) for (const i of (FACET.form.get(val)||[])) acc.add(i);
    sets.push(acc);
  }
  if (pq.fieldFilters.auth.length){
    const acc = new Set();
    for (const [k, arr] of FACET.auth){
      const lbl = SCHEMA.enums.auth[k];
      if (pq.fieldFilters.auth.some(v => k===v || norm(lbl.l)===v || norm(lbl.s)===v)) for (const i of arr) acc.add(i);
    }
    sets.push(acc);
  }
  if (pq.fieldFilters.group.length){
    const acc = new Set();
    for (const [k, arr] of FACET.group){
      const nk = norm(k);
      if (pq.fieldFilters.group.some(v => nk.includes(v))) for (const i of arr) acc.add(i);
    }
    sets.push(acc);
  }
  for (const c of pq.doseConstraints){
    const acc = new Set();
    const field = c.field==='conc' ? 'concTokens' : c.field==='max' ? 'maxTokens' : 'dayTokens';
    for (let i=0;i<N;i++) if (doseMatches(c, META[i][field])) acc.add(i);
    sets.push(acc);
  }
  if (!sets.length) return ALL_INDICES;
  sets.sort((a,b)=>a.size-b.size);
  let base = sets[0];
  for (let s=1;s<sets.length;s++){ const next = new Set(); for (const v of base) if (sets[s].has(v)) next.add(v); base = next; }
  return [...base];
}

function runSearch(raw){
  const pq = parseQuery(raw);
  const universe = computeUniverse(pq);
  const sKey = structKey(pq);
  const freeKey = pq.freeTerms.join(' ');
  let candidateUniverse = universe;
  if (state.lastQuery.resultIdxs && state.lastQuery.structKey === sKey && freeKey.length > 0 && state.lastQuery.freeKey.length > 0 && freeKey.startsWith(state.lastQuery.freeKey)){
    candidateUniverse = state.lastQuery.resultIdxs;
  }
  const merged = executeSearch(pq.freeTerms, pq.phrases, pq.excludes, candidateUniverse, state.settings.tolerance, state.settings.enough);
  let arr = [...merged.entries()];
  applySort(arr);
  const idxs = arr.map(e=>e[0]);
  state.lastQuery = { freeKey, structKey: sKey, resultIdxs: idxs };
  state.currentIdxs = idxs;
  state.currentPasses = new Map(arr.map(([i,v])=>[i, v.pass]));
  state.currentFreeText = freeKey;
  return idxs;
}

function applySort(arr){
  switch(state.sort){
    case 'name':
      arr.sort((a,b)=> ROW(a[0],'name').localeCompare(ROW(b[0],'name'))); break;
    case 'conc':
      arr.sort((a,b)=>{
        const ca = (META[a[0]].concTokens[0]||{}).num ?? Infinity;
        const cb = (META[b[0]].concTokens[0]||{}).num ?? Infinity;
        return ca - cb;
      }); break;
    case 'form':
      arr.sort((a,b)=> (ROW(a[0],'form')||'').localeCompare(ROW(b[0],'form')||'')); break;
    case 'class':
      arr.sort((a,b)=> (ROW(a[0],'group')||'').localeCompare(ROW(b[0],'group')||'')); break;
    default:
      arr.sort((a,b)=> b[1].score - a[1].score || ROW(a[0],'name').localeCompare(ROW(b[0],'name')));
  }
  arr.sort((a,b)=>{
    const pa = state.pins.has(ROW(a[0],'id')) ? 1 : 0;
    const pb = state.pins.has(ROW(b[0],'id')) ? 1 : 0;
    return pb - pa;
  });
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function highlightName(name, freeText){
  if (!freeText) return esc(name);
  const hay = [name.toLowerCase()];
  const uf = getUF(TOLERANCE.balanced.opts);
  const idxs = uf.filter(hay, freeText);
  if (!idxs || !idxs.length) return esc(name);
  const info = uf.info(idxs, hay, freeText);
  if (!info.idx.length) return esc(name);
  const order = uf.sort(info, hay, freeText);
  const k = order[0];
  if (!info.ranges[k]) return esc(name);
  return uFuzzy.highlight(name, info.ranges[k], (part, matched) => matched ? '<b>'+esc(part)+'</b>' : esc(part));
}

function titleCase(s){ return s.replace(/\w\S*/g, t => t[0].toUpperCase()+t.slice(1).toLowerCase()); }

const PASS_LABEL = { 0:'exact', 1:'fuzzy', 2:'typo', 3:'field', 4:'rescue', 9:'' };

function cardHTML(i){
  const id = ROW(i,'id');
  const name = ROW(i,'name');
  const conc = ROW(i,'conc');
  const formKey = ROW(i,'form');
  const authKey = ROW(i,'auth');
  const duration = ROW(i,'duration');
  const group = ROW(i,'group');
  const inh = ROW(i,'inh') || 0;
  const authInh = !!(inh & 1), durInh = !!(inh & 2), dayInh = !!(inh & 4), maxInh = !!(inh & 8);
  const formLbl = formKey ? SCHEMA.enums.form[formKey] : null;
  const authLbl = authKey ? SCHEMA.enums.auth[authKey] : null;
  const nameHTML = highlightName(name, state.currentFreeText);
  const pinned = state.pins.has(id);

  let pills = '';
  if (conc) pills += '<span class="pill pill-conc">'+esc(conc)+'</span>';
  if (formLbl) pills += '<span class="pill pill-form">'+esc(formLbl.s)+'</span>';
  if (authLbl) pills += '<span class="pill pill-auth-'+authKey+(authInh?' inherited':'')+'" title="'+(authInh?'Same as previous entry':'')+'">'+esc(authLbl.s)+'</span>';
  if (duration) pills += '<span class="pill pill-duration'+(durInh?' inherited':'')+'" dir="auto" title="'+(durInh?'Same as previous entry':'')+'">'+esc(duration)+'</span>';

  const pass = state.currentPasses.get(i);
  const showProv = state.settings.showProvenance && pass != null && PASS_LABEL[pass];
  const showScore = state.settings.showScores;

  return (
    '<div class="card" data-i="'+i+'" role="button" tabindex="0">'+
      '<div class="card-main">'+
        '<div class="card-name">'+nameHTML+'</div>'+
        '<div class="pillrow">'+pills+'</div>'+
        (group ? '<div class="card-class">'+esc(group)+'</div>' : '')+
        (showProv ? '<div class="matchbadge">'+PASS_LABEL[pass]+(showScore?' · '+Math.round(state.currentPasses.get(i)):'')+'</div>' : '')+
      '</div>'+
      '<div class="card-rail">'+
        '<button class="copybtn pinbtn" data-i="'+i+'" data-act="pin" aria-label="Pin" title="Pin">'+(pinned ? svgStarFilled() : svgStar())+'</button>'+
        '<button class="copybtn" data-i="'+i+'" data-act="copy" aria-label="Copy" title="Copy">'+svgCopy()+'</button>'+
      '</div>'+
    '</div>'
  );
}

function svgCopy(){ return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path></svg>'; }

const els = {};
function q(id){ return document.getElementById(id); }

function greeting(){
  const h = new Date().getHours();
  if (h < 5) return 'Still up?';
  if (h < 12) return 'Good morning.';
  if (h < 17) return 'Good afternoon.';
  if (h < 21) return 'Good evening.';
  return 'Good evening.';
}

function renderEmptyState(){
  const chips = state.recents.slice(0,8).map(r => '<span class="chip recent-chip" data-q="'+esc(r)+'">'+esc(r)+'</span>').join('');
  els.results.innerHTML = (
    '<div class="emptystate">'+
      '<div class="bloom"></div>'+
      '<div class="greet">'+greeting()+'</div>'+
      (chips ? '<div class="recentchips">'+chips+'</div>' : '<div style="color:var(--ink-3);font-size:13.5px">Type a drug name to begin.</div>')+
    '</div>'
  );
  els.sentinel.style.display = 'none';
  els.resultcount.textContent = '';
}

function renderNoResults(){
  els.results.innerHTML = (
    '<div class="emptystate">'+
      '<div class="bloom"></div>'+
      '<div class="greet">No matches.</div>'+
      '<div style="color:var(--ink-3);font-size:13.5px">Try a shorter term, or loosen tolerance in Settings.</div>'+
    '</div>'
  );
  els.sentinel.style.display = 'none';
  els.resultcount.textContent = '0 results';
}

function paint(reset){
  if (reset) state.renderCount = 0;
  const limit = state.settings.limit || CONFIG.defaultLimit;
  const total = state.currentIdxs.length;
  const upto = Math.min(total, state.renderCount + limit);
  const slice = state.currentIdxs.slice(reset ? 0 : state.renderCount, upto);
  const html = slice.map(cardHTML).join('');
  if (reset) els.results.innerHTML = html; else els.results.insertAdjacentHTML('beforeend', html);
  state.renderCount = upto;
  els.sentinel.style.display = upto < total ? 'block' : 'none';
  els.resultcount.textContent = total === 0 ? '0 results' : (total + (total===1?' result':' results'));
  els.resultcount.setAttribute('aria-live','polite');
}

let rafToken = null, pendingValue = null;
function scheduleSearch(){
  if (rafToken) return;
  rafToken = requestAnimationFrame(() => {
    rafToken = null;
    const raw = pendingValue;
    if (raw.trim() === '' && state.activeFacets.form.size===0 && state.activeFacets.auth.size===0 && state.activeFacets.group.size===0){
      state.currentIdxs = []; state.currentFreeText=''; renderEmptyState(); updateChipCounts(); return;
    }
    const idxs = runSearch(raw);
    if (!idxs.length) { renderNoResults(); } else { paint(true); }
    updateChipCounts();
  });
}

function onInput(e){
  pendingValue = e.target.value;
  els.clearbtn.classList.toggle('show', pendingValue.length>0);
  scheduleSearch();
}

function commitRecent(raw){
  const v = raw.trim();
  if (!v) return;
  const list = state.recents.filter(r => r.toLowerCase() !== v.toLowerCase());
  list.unshift(v);
  state.recents = list.slice(0,8);
  saveJSON('rx.recents.v1', state.recents);
}

const FORM_KEYS = Object.keys(SCHEMA.enums.form).filter(k=>k!=='other');
const AUTH_KEYS = Object.keys(SCHEMA.enums.auth).filter(k=>k!=='other');
const GROUP_KEYS = [...FACET.group.keys()].sort((a,b)=>a.localeCompare(b));

function updateChipCounts(){
  const formChip = q('chip-filters');
  const activeCount = state.activeFacets.form.size + state.activeFacets.auth.size + state.activeFacets.group.size;
  if (formChip){
    formChip.classList.toggle('active', activeCount>0);
    formChip.querySelector('.chip-label').textContent = activeCount>0 ? ('Filters ('+activeCount+')') : 'Filters';
  }
}

function buildFacetSheet(){
  const sections = [
    ['Form', 'form', FORM_KEYS.map(k=>({v:k, l:SCHEMA.enums.form[k].l}))],
    ['Authority', 'auth', AUTH_KEYS.map(k=>({v:k, l:SCHEMA.enums.auth[k].l}))],
    ['Class', 'group', GROUP_KEYS.map(k=>({v:k, l:k}))],
  ];
  let html = '';
  for (const [title, type, items] of sections){
    html += '<div class="facet-group"><div class="facet-title">'+title+'</div><div class="facet-chips">';
    for (const it of items){
      const active = state.activeFacets[type].has(it.v);
      html += '<span class="chip facet-opt'+(active?' active':'')+'" data-type="'+type+'" data-v="'+esc(it.v)+'">'+esc(it.l)+'</span>';
    }
    html += '</div></div>';
  }
  html += '<button class="btn" id="clearFilters" style="width:100%">Clear all filters</button>';
  q('sheet-filters-body').innerHTML = html;
}

function openSheet(name){
  q('sheetbackdrop').classList.add('show');
  document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('show'));
  if (name === 'filters') buildFacetSheet();
  if (name === 'sort') buildSortSheet();
  if (name === 'settings') buildSettingsSheet();
  q('sheet-'+name).classList.add('show');
}
function closeSheets(){

}

function buildSortSheet(){
  const opts = [['relevance','Relevance'],['name','Name A→Z'],['conc','Concentration'],['form','Form'],['class','Class']];
  let html = '';
  for (const [v,l] of opts){
    html += '<div class="rowline sort-opt" data-v="'+v+'"><span class="rl-label">'+l+'</span><span class="rl-check">'+svgCheck()+'</span></div>';
  }

  document.querySelectorAll('.sort-opt').forEach(el => el.classList.toggle('selected', el.dataset.v === state.sort));
}
function svgCheck(){ return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>'; }

function buildSettingsSheet(){
  const tol = state.settings.tolerance;

function togglerow(key, label, val){

function openDetail(i){
  const name = ROW(i,'name');
  const conc = ROW(i,'conc');
  const formKey = ROW(i,'form');
  const authKey = ROW(i,'auth');
  const duration = ROW(i,'duration');
  const maxDose = ROW(i,'maxDose');
  const dayDose = ROW(i,'dayDose');
  const group = ROW(i,'group');
  const syn = ROW(i,'syn') || [];
  const inh = ROW(i,'inh') || 0;
  const authInh = !!(inh&1), durInh = !!(inh&2), dayInh = !!(inh&4), maxInh = !!(inh&8);
  const formLbl = formKey ? SCHEMA.enums.form[formKey].l : null;
  const authLbl = authKey ? SCHEMA.enums.auth[authKey].l : null;

  const rows = [
    ['Concentration', conc, false, false],
    ['Form', formLbl, false, false],
    ['Authority', authLbl, authInh, false],
    ['Duration', duration, durInh, true],
    ['Max dose', maxDose, maxInh, false],
    ['Daily dose', dayDose, dayInh, false],
    ['Class', group, false, false],
    ['Also known as', syn.length ? syn.join(', ') : null, false, false],
  ].filter(r => r[1]);

  let html = '<div class="detail-title">'+esc(name)+'</div>';
  html += '<div class="detail-sub">'+(syn.length ? esc(syn.slice(0,3).join(' · ')) : ' ')+'</div>';
  html += '<div class="detail-grid">';
  for (const [k,v,inherited,rtl] of rows){
    html += '<div class="detail-row"><span class="detail-k">'+k+'</span><span class="detail-v"'+(rtl?' dir="auto"':'')+'>'+esc(v)+(inherited?'<div class="inh-note">Same as previous entry</div>':'')+'</span></div>';
  }
  html += '</div>';
  const pinned = state.pins.has(ROW(i,'id'));
  html += '<div class="detail-actions">';
  html += '<button class="btn" id="detailPin" data-i="'+i+'">'+(pinned?'Unpin':'Pin')+'</button>';
  html += '<button class="btn primary" id="detailCopy" data-i="'+i+'">Copy</button>';
  html += '</div>';
  q('sheet-detail-body').innerHTML = html;
  openSheet('detail');
}

function rowAsText(i){
  const parts = [ROW(i,'name')];
  if (ROW(i,'conc')) parts.push(ROW(i,'conc'));
  const formKey = ROW(i,'form'); if (formKey) parts.push(SCHEMA.enums.form[formKey].l);
  const authKey = ROW(i,'auth'); if (authKey) parts.push(SCHEMA.enums.auth[authKey].l);
  if (ROW(i,'duration')) parts.push(ROW(i,'duration'));
  if (ROW(i,'maxDose')) parts.push('Max: '+ROW(i,'maxDose'));
  if (ROW(i,'dayDose')) parts.push('Daily: '+ROW(i,'dayDose'));
  return parts.join(' — ');
}

let toastTimer = null;
function toast(msg){
  const el = q('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 1600);
}

function copyText(text){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast('Copied')).catch(()=>fallbackCopy(text));
  } else fallbackCopy(text);
  if (navigator.vibrate) navigator.vibrate(8);
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('Copied'); }catch(e){ toast('Copy failed'); }
  document.body.removeChild(ta);
}

function togglePin(i){
  const id = ROW(i,'id');
  if (state.pins.has(id)) state.pins.delete(id); else state.pins.add(id);
  saveJSON('rx.pins.v1', [...state.pins]);
}

function csvEscape(v){
  const s = String(v==null?'':v);
  if (/[",\r\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function exportCSV(){
  const header = ['Drug','Concentration','Form','Authority','Duration','Max dose','Daily dose','Class'];
  const lines = [header.map(csvEscape).join(',')];
  for (const i of state.currentIdxs.length ? state.currentIdxs : ALL_INDICES){
    const formKey = ROW(i,'form'); const authKey = ROW(i,'auth');
    lines.push([
      ROW(i,'name'), ROW(i,'conc')||'', formKey?SCHEMA.enums.form[formKey].l:'', authKey?SCHEMA.enums.auth[authKey].l:'',
      ROW(i,'duration')||'', ROW(i,'maxDose')||'', ROW(i,'dayDose')||'', ROW(i,'group')||'',
    ].map(csvEscape).join(','));
  }
  const csv = '\uFEFF' + lines.join('\r\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10).replace(/-/g,'');
  const qpart = els.q.value.trim() ? els.q.value.trim().replace(/[^a-z0-9]+/gi,'-').slice(0,30) : 'all';
  a.href = url; a.download = 'formulary-'+qpart+'-'+stamp+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function copyAllTSV(){
  const header = ['Drug','Concentration','Form','Authority','Duration','Max dose','Daily dose','Class'];
  const lines = [header.join('\t')];
  for (const i of state.currentIdxs){
    const formKey = ROW(i,'form'); const authKey = ROW(i,'auth');
    lines.push([
      ROW(i,'name'), ROW(i,'conc')||'', formKey?SCHEMA.enums.form[formKey].l:'', authKey?SCHEMA.enums.auth[authKey].l:'',
      ROW(i,'duration')||'', ROW(i,'maxDose')||'', ROW(i,'dayDose')||'', ROW(i,'group')||'',
    ].join('\t'));
  }
  copyText(lines.join('\n'));
}

function initChips(){
  const wrap = q('chiprow');
  let html = '<span class="chip" id="chip-filters"><span class="chip-label">Filters</span></span>';
  html += '<span class="chip" id="chip-sort"><span class="chip-label">Sort</span></span>';
  html += '<span class="chip" id="chip-pins">Pinned ('+state.pins.size+')</span>';
  wrap.innerHTML = html;
}

function bindEvents(){
  els.q.addEventListener('input', onInput);
  els.q.addEventListener('focus', ()=> els.searchbar.classList.add('focused'));
  els.q.addEventListener('blur', ()=>{ els.searchbar.classList.remove('focused'); if (els.q.value.trim()) commitRecent(els.q.value); });
  els.q.addEventListener('keydown', e => {
    if (e.key === 'Escape'){ els.q.value=''; pendingValue=''; els.clearbtn.classList.remove('show'); scheduleSearch(); }
    if (e.key === 'Enter' && state.currentIdxs.length){ openDetail(state.currentIdxs[0]); }
  });
  els.clearbtn.addEventListener('click', ()=>{ els.q.value=''; pendingValue=''; els.clearbtn.classList.remove('show'); scheduleSearch(); els.q.focus(); });

  document.addEventListener('keydown', e => {
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if ((e.key === '/' && tag !== 'INPUT') || ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k')){
      e.preventDefault(); els.q.focus();
    }
  });

  els.results.addEventListener('click', e => {
    const actBtn = e.target.closest('[data-act]');
    if (actBtn){
      const i = parseInt(actBtn.dataset.i, 10);
      if (actBtn.dataset.act === 'copy') copyText(rowAsText(i));
      if (actBtn.dataset.act === 'pin'){ togglePin(i); paint(true); }
      e.stopPropagation();
      return;
    }
    const recentChip = e.target.closest('.recent-chip');
    if (recentChip){ els.q.value = recentChip.dataset.q; pendingValue = els.q.value; els.clearbtn.classList.add('show'); scheduleSearch(); return; }
    const card = e.target.closest('.card');
    if (card){ openDetail(parseInt(card.dataset.i,10)); }
  });

  q('chip-filters').addEventListener('click', ()=>openSheet('filters'));
  q('chip-sort').addEventListener('click', ()=>openSheet('sort'));
  q('settingsBtn').addEventListener('click', ()=>openSheet('settings'));
  q('chip-pins').addEventListener('click', ()=>{
    state.currentIdxs = ALL_INDICES.filter(i => state.pins.has(ROW(i,'id')));
    state.currentFreeText=''; state.currentPasses = new Map();
    if (!state.currentIdxs.length) renderNoResults(); else paint(true);
  });

  q('sheetbackdrop').addEventListener('click', closeSheets);
  document.querySelectorAll('.sheet-close').forEach(b => b.addEventListener('click', closeSheets));

  q('sheet-filters-body').addEventListener('click', e => {
    const opt = e.target.closest('.facet-opt');
    if (opt){
      const type = opt.dataset.type, v = opt.dataset.v;
      if (state.activeFacets[type].has(v)) state.activeFacets[type].delete(v); else state.activeFacets[type].add(v);
      buildFacetSheet();
      scheduleFilterSearch();
    }
    if (e.target.id === 'clearFilters'){
      state.activeFacets.form.clear(); state.activeFacets.auth.clear(); state.activeFacets.group.clear();
      buildFacetSheet(); scheduleFilterSearch();
    }
  });

  q('sheet-sort-body').addEventListener('click', e => {
    const opt = e.target.closest('.sort-opt');
    if (opt){
      state.sort = opt.dataset.v; buildSortSheet();
      if (state.currentIdxs.length){
        const arr = state.currentIdxs.map(i => [i, { score:0, pass: state.currentPasses.get(i) }]);
        applySort(arr);
        state.currentIdxs = arr.map(e => e[0]);
        paint(true);
      }
      closeSheets();
    }
  });

  q('sheet-settings-body').addEventListener('click', e => {
    const tolOpt = e.target.closest('.tol-opt');
    if (tolOpt){ state.settings.tolerance = tolOpt.dataset.v; saveSettings(); buildSettingsSheet(); scheduleFilterSearch(); return; }
    const sw = e.target.closest('.switch');
    if (sw){ const key = sw.dataset.key; state.settings[key] = !state.settings[key]; sw.classList.toggle('on'); saveSettings(); if (state.currentIdxs.length) paint(true); return; }
    if (e.target.id === 'aboutOpen'){ openSheet('about'); return; }
    if (e.target.id === 'downloadSW'){ downloadServiceWorker(); return; }
    if (e.target.id === 'resetData'){
      if (confirm('Clear pins, recent searches, and settings on this device?')){
        localStorage.removeItem(SETTINGS_KEY); localStorage.removeItem('rx.recents.v1'); localStorage.removeItem('rx.pins.v1');
        state.settings = Object.assign({}, defaultSettings); state.recents = []; state.pins = new Set();
        closeSheets(); renderEmptyState();
      }
      return;
    }
  });
  q('sheet-settings-body').addEventListener('input', e => {
    if (e.target.id === 'limitSlider'){ state.settings.limit = parseInt(e.target.value,10); saveSettings(); buildSettingsSheet(); }
  });

  q('sheet-detail-body').addEventListener('click', e => {
    const btn = e.target.closest('button[data-i]');
    if (!btn) return;
    const i = parseInt(btn.dataset.i,10);
    if (btn.id === 'detailCopy') copyText(rowAsText(i));
    if (btn.id === 'detailPin'){ togglePin(i); openDetail(i); }
  });

  q('exportBtn').addEventListener('click', exportCSV);
  q('copyAllBtn').addEventListener('click', copyAllTSV);

  let lastScrollY = 0;
  window.addEventListener('scroll', () => {
    const y = window.scrollY;
    if (y > lastScrollY && y > 80) els.bottombar.classList.add('hide');
    else els.bottombar.classList.remove('hide');
    lastScrollY = y;
  }, { passive:true });

  const io = new IntersectionObserver(entries => {
    if (entries.some(e=>e.isIntersecting) && state.renderCount < state.currentIdxs.length) paint(false);
  });
  io.observe(els.sentinel);
}

let filterSearchTimer = null;
function scheduleFilterSearch(){
  clearTimeout(filterSearchTimer);
  filterSearchTimer = setTimeout(()=>{ pendingValue = els.q.value; if(!rafToken) scheduleSearch(); }, 0);
}

function downloadServiceWorker(){
  const src = q('sw-source').textContent;
  const blob = new Blob([src], { type:'text/javascript' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'sw.js';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  toast('sw.js downloaded — place it next to this file');
}

function registerPWA(){
  if ('caches' in window){
    caches.open('rx-v'+SCHEMA.version).then(c => c.add(location.pathname || './')).catch(()=>{});
  }
  if ('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
  if (isIOS && !standalone && !localStorage.getItem('rx.ioshint.dismissed')){
    const hint = document.createElement('div');
    hint.className = 'ios-hint';
    hint.innerHTML = 'Add to Home Screen: tap Share, then "Add to Home Screen".<button aria-label="Dismiss">&times;</button>';
    document.body.appendChild(hint);
    hint.querySelector('button').addEventListener('click', ()=>{ hint.remove(); localStorage.setItem('rx.ioshint.dismissed','1'); });
  }
}

  els.searchbar = q('searchbar'); els.clearbtn = q('clearbtn');
  els.bottombar = q('bottombar'); els.resultcount = q('resultcount');

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

window.__rx = {
  bench(needles){
    needles = needles || ['diclo','asprin','panadol','vitamin','amoxicillin 500','form:amp sp'];
    const results = {};
    for (const needle of needles){
      const times = [];
      let acc = '';
      for (const ch of needle){
        acc += ch;
        const t0 = performance.now();
        runSearch(acc);
        times.push(performance.now()-t0);
      }
      times.sort((a,b)=>a-b);
      const p50 = times[Math.floor(times.length*0.5)];
      const p95 = times[Math.floor(times.length*0.95)] ?? times[times.length-1];
      results[needle] = { p50: +p50.toFixed(3), p95: +p95.toFixed(3), keystrokes: times.length };
    }
    console.table(results);
    return results;
  },
  audit(){
    const issues = [];
    const seen = new Map();
    for (let i=0;i<N;i++){
      const name = ROW(i,'name');
      if (!name) issues.push({ i, id:ROW(i,'id'), issue:'missing name' });
      const conc = ROW(i,'conc');
      if (conc && !/\d/.test(conc)) issues.push({ i, id:ROW(i,'id'), issue:'unparseable conc', conc });
      const formKey = ROW(i,'form');
      if (formKey && !SCHEMA.enums.form[formKey]) issues.push({ i, id:ROW(i,'id'), issue:'unknown form enum', formKey });
      const key = (name||'').toLowerCase()+'|'+(conc||'')+'|'+(formKey||'');
      if (seen.has(key)) issues.push({ i, id:ROW(i,'id'), issue:'duplicate name+conc+form', dupOf: seen.get(key) });
      else seen.set(key, ROW(i,'id'));
      const day = META[i].dayTokens, max = META[i].maxTokens;
      if (day.length && max.length && day[0].num > max[0].num && (!day[0].unit || !max[0].unit || day[0].unit===max[0].unit)){
        issues.push({ i, id:ROW(i,'id'), issue:'daily-dose-above-max', day:ROW(i,'dayDose'), max:ROW(i,'maxDose') });
      }
    }
    console.table(issues);
    return issues;
  },
  state, SCHEMA, DATA, F, ROW, HAY_A, HAY_B, TOKENS, PRE, FACET, META,
  parseQuery, runSearch, computeUniverse, norm, executeSearch, scoreOf, TOLERANCE, getUF,
};

})();
